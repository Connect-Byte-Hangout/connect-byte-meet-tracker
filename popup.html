<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 320px;
    min-height: 180px;
    font-family: 'Segoe UI', sans-serif;
    background: #f9f7ff;
    padding: 20px;
  }
  .header {
    display: flex; align-items: center;
    gap: 10px; margin-bottom: 16px;
  }
  .logo {
    width: 36px; height: 36px;
    background: #b39ddb; border-radius: 10px;
    display: flex; align-items: center;
    justify-content: center; font-size: 20px;
  }
  .titulo { font-size: 15px; font-weight: 700; color: #6a1b9a; }
  .subtitulo { font-size: 11px; color: #9e9e9e; }
  .btn-capturar {
    width: 100%; padding: 11px;
    background: linear-gradient(135deg, #b39ddb, #9575cd);
    color: white; border: none; border-radius: 10px;
    cursor: pointer; font-size: 14px; font-weight: 600;
    transition: opacity 0.2s;
  }
  .btn-capturar:hover { opacity: 0.88; }
  .btn-exportar {
    width: 100%; padding: 9px;
    background: white; color: #6a1b9a;
    border: 2px solid #b39ddb; border-radius: 10px;
    cursor: pointer; font-size: 13px; font-weight: 600;
    margin-top: 8px; transition: background 0.2s; display: none;
  }
  .btn-exportar:hover { background: #f3e5f5; }
  .badge {
    display: inline-block; background: #ede7f6;
    color: #6a1b9a; font-size: 12px; font-weight: 600;
    padding: 4px 10px; border-radius: 20px; margin: 12px 0 8px;
  }
  ul {
    list-style: none; max-height: 200px; overflow-y: auto;
    border-radius: 8px; background: white; border: 1px solid #ede7f6;
  }
  li {
    padding: 9px 14px; font-size: 13px; color: #333;
    border-bottom: 1px solid #f3e5f5;
    display: flex; align-items: center; gap: 8px;
  }
  li:last-child { border-bottom: none; }
  li::before {
    content: ''; width: 8px; height: 8px;
    background: #b39ddb; border-radius: 50%; flex-shrink: 0;
  }
  #vazio {
    text-align: center; font-size: 12px; color: #aaa;
    margin-top: 16px; display: none; line-height: 1.6;
  }
  .divider { height: 1px; background: #ede7f6; margin: 14px 0; }
</style>
</head>
<body>
  <div class="header">
    <div class="logo">🐙</div>
    <div>
      <div class="titulo">Connect Byte Attendance</div>
      <div class="subtitulo">Google Meet tracker</div>
    </div>
  </div>
  <div class="divider"></div>
  <button class="btn-capturar" id="btn-capturar">Capturar participantes</button>
  <button class="btn-exportar" id="btn-exportar">⬇ Baixar Excel</button>
  <div id="badge-area"></div>
  <ul id="lista"></ul>
  <p id="vazio"></p>
  <script src="xlsx.full.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
